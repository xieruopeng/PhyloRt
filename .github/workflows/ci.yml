name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite
        run: |
          pytest tests/test_cli.py tests/test_transform.py tests/test_prediction.py tests/test_plotting.py tests/test_simulators.py

  predict-linux:
    name: predict deps (ubuntu-latest, py3.10)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package with predict and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Validate prediction path imports
        run: |
          python -c "import PhyloRt; from PhyloRt.cli import build_parser; from PhyloRt.workflow import run; print('predict-path imports OK')"

      - name: Run prediction-related tests
        run: |
          pytest tests/test_prediction.py tests/test_cli.py
